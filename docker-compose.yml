version: '3.8'

services:
  # Наша новая инфраструктурная часть: Linux-образ Redis
  redis:
    image: redis:7-alpine
    container_name: project_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # Ваша существующая база данных PostgreSQL
  postgres:
    image: postgres:alpine
    container_name: project_postgres
    environment:
      POSTGRES_USER: stan
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    restart: always

volumes:
  pgdata:
  redis_data:
